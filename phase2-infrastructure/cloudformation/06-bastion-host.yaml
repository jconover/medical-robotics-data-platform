AWSTemplateFormatVersion: '2010-09-09'
Description: 'Medical Robotics Data Platform - Bastion Host for Database Access'

Parameters:
  EnvironmentName:
    Description: Environment name prefix for resources
    Type: String
    Default: medrobotics
    AllowedPattern: '[a-z0-9-]+'

  InstanceType:
    Description: EC2 instance type for bastion host
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  KeyPairName:
    Description: (Optional) EC2 Key Pair for SSH access. Leave empty to use SSM Session Manager only.
    Type: String
    Default: ''

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]

Resources:
  # IAM Role for Bastion Host (allows SSM Session Manager access)
  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-bastion-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: CloudFormationReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-bastion-role'
        - Key: Project
          Value: medical-robotics-data-platform

  # Instance Profile
  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-bastion-profile'
      Roles:
        - !Ref BastionRole

  # Bastion Host EC2 Instance
  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !Ref BastionInstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-public-subnet-1'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-bastion-sg-id'
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Update system
          yum update -y

          # Install PostgreSQL 17 client from official PostgreSQL repository
          # Amazon Linux 2023 is based on Fedora, similar to RHEL 9
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm

          # Disable built-in PostgreSQL module to avoid conflicts
          dnf -qy module disable postgresql

          # Install PostgreSQL 17 client
          dnf install -y postgresql17

          # Verify installation
          psql --version

          # Install useful tools
          yum install -y jq git tmux vim

          # Install AWS CLI v2 (latest)
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install
          rm -rf aws awscliv2.zip

          # Configure CloudWatch Logs
          yum install -y amazon-cloudwatch-agent

          # Create helper script for database connection
          cat > /home/ec2-user/connect-to-rds.sh << 'EOFSCRIPT'
          #!/bin/bash
          # Get RDS endpoint from CloudFormation
          RDS_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name ${EnvironmentName}-rds \
            --region ${AWS::Region} \
            --query 'Stacks[0].Outputs[?OutputKey==`DBEndpoint`].OutputValue' \
            --output text)

          echo "RDS Endpoint: $RDS_ENDPOINT"
          echo "Connecting to PostgreSQL..."
          psql -h $RDS_ENDPOINT -U dbadmin -d medrobotics
          EOFSCRIPT

          chmod +x /home/ec2-user/connect-to-rds.sh
          chown ec2-user:ec2-user /home/ec2-user/connect-to-rds.sh

          # Create schema setup script
          cat > /home/ec2-user/setup-schema.sh << 'EOFSCRIPT'
          #!/bin/bash
          # Get RDS endpoint from CloudFormation
          RDS_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name ${EnvironmentName}-rds \
            --region ${AWS::Region} \
            --query 'Stacks[0].Outputs[?OutputKey==`DBEndpoint`].OutputValue' \
            --output text)

          echo "RDS Endpoint: $RDS_ENDPOINT"
          echo "Setting up database schema..."

          # Check if schema file is provided
          if [ -z "$1" ]; then
            echo "Usage: ./setup-schema.sh <path-to-sql-file>"
            echo "Example: ./setup-schema.sh /tmp/01-create-tables.sql"
            exit 1
          fi

          psql -h $RDS_ENDPOINT -U dbadmin -d medrobotics -f "$1"
          EOFSCRIPT

          chmod +x /home/ec2-user/setup-schema.sh
          chown ec2-user:ec2-user /home/ec2-user/setup-schema.sh

          # Create SQL schema file 01-create-tables.sql
          cat > /home/ec2-user/01-create-tables.sql << 'EOFSQL'
          -- Medical Robotics Data Platform - PostgreSQL Schema
          -- Creates tables for surgical robots, procedures, outcomes, and maintenance logs

          -- Drop tables if they exist (for clean re-runs)
          DROP TABLE IF EXISTS procedure_outcomes CASCADE;
          DROP TABLE IF EXISTS surgical_procedures CASCADE;
          DROP TABLE IF EXISTS robot_maintenance_logs CASCADE;
          DROP TABLE IF EXISTS surgical_robots CASCADE;

          -- Create surgical_robots table
          CREATE TABLE surgical_robots (
              robot_id UUID PRIMARY KEY,
              robot_serial_number VARCHAR(50) UNIQUE NOT NULL,
              robot_model VARCHAR(100) NOT NULL,
              manufacturer VARCHAR(100) NOT NULL,
              installation_date DATE NOT NULL,
              facility_id VARCHAR(50) NOT NULL,
              facility_name VARCHAR(200) NOT NULL,
              status VARCHAR(20) NOT NULL CHECK (status IN ('operational', 'maintenance', 'retired')),
              last_maintenance_date DATE,
              total_procedures INTEGER DEFAULT 0,
              firmware_version VARCHAR(20),
              created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
          );

          -- Create indexes for surgical_robots
          CREATE INDEX idx_robots_facility ON surgical_robots(facility_id);
          CREATE INDEX idx_robots_status ON surgical_robots(status);
          CREATE INDEX idx_robots_model ON surgical_robots(robot_model);

          -- Create robot_maintenance_logs table
          CREATE TABLE robot_maintenance_logs (
              maintenance_id UUID PRIMARY KEY,
              robot_id UUID NOT NULL REFERENCES surgical_robots(robot_id) ON DELETE CASCADE,
              maintenance_date DATE NOT NULL,
              maintenance_type VARCHAR(50) NOT NULL CHECK (maintenance_type IN ('routine', 'emergency', 'upgrade', 'calibration')),
              technician_id VARCHAR(50) NOT NULL,
              technician_name VARCHAR(200) NOT NULL,
              issues_found TEXT,
              actions_taken TEXT,
              parts_replaced TEXT,
              downtime_hours DECIMAL(6,2),
              next_maintenance_date DATE,
              cost DECIMAL(10,2),
              created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
          );

          -- Create indexes for robot_maintenance_logs
          CREATE INDEX idx_maintenance_robot ON robot_maintenance_logs(robot_id);
          CREATE INDEX idx_maintenance_date ON robot_maintenance_logs(maintenance_date);
          CREATE INDEX idx_maintenance_type ON robot_maintenance_logs(maintenance_type);

          -- Create surgical_procedures table
          CREATE TABLE surgical_procedures (
              procedure_id UUID PRIMARY KEY,
              robot_id UUID NOT NULL REFERENCES surgical_robots(robot_id) ON DELETE CASCADE,
              procedure_type VARCHAR(100) NOT NULL,
              procedure_category VARCHAR(50) NOT NULL,
              start_time TIMESTAMP NOT NULL,
              end_time TIMESTAMP NOT NULL,
              duration_minutes INTEGER NOT NULL,
              surgeon_id VARCHAR(50) NOT NULL,
              surgeon_name VARCHAR(200) NOT NULL,
              patient_id VARCHAR(50) NOT NULL,
              patient_age INTEGER NOT NULL CHECK (patient_age >= 0 AND patient_age <= 120),
              patient_gender VARCHAR(20),
              complexity_score DECIMAL(3,2) CHECK (complexity_score >= 1.0 AND complexity_score <= 5.0),
              status VARCHAR(20) NOT NULL CHECK (status IN ('completed', 'in_progress', 'aborted', 'cancelled')),
              created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
              CONSTRAINT check_end_after_start CHECK (end_time >= start_time)
          );

          -- Create indexes for surgical_procedures
          CREATE INDEX idx_procedures_robot ON surgical_procedures(robot_id);
          CREATE INDEX idx_procedures_start_time ON surgical_procedures(start_time);
          CREATE INDEX idx_procedures_category ON surgical_procedures(procedure_category);
          CREATE INDEX idx_procedures_surgeon ON surgical_procedures(surgeon_id);
          CREATE INDEX idx_procedures_status ON surgical_procedures(status);

          -- Create procedure_outcomes table
          CREATE TABLE procedure_outcomes (
              outcome_id UUID PRIMARY KEY,
              procedure_id UUID UNIQUE NOT NULL REFERENCES surgical_procedures(procedure_id) ON DELETE CASCADE,
              success_status VARCHAR(20) NOT NULL CHECK (success_status IN ('successful', 'complicated', 'failed')),
              blood_loss_ml INTEGER CHECK (blood_loss_ml >= 0),
              complications TEXT,
              hospital_stay_days INTEGER CHECK (hospital_stay_days >= 0),
              readmission_30day BOOLEAN DEFAULT FALSE,
              patient_satisfaction_score INTEGER CHECK (patient_satisfaction_score >= 1 AND patient_satisfaction_score <= 10),
              surgeon_notes TEXT,
              recovery_score INTEGER CHECK (recovery_score >= 1 AND recovery_score <= 100),
              follow_up_required BOOLEAN DEFAULT FALSE,
              created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
          );

          -- Create indexes for procedure_outcomes
          CREATE INDEX idx_outcomes_procedure ON procedure_outcomes(procedure_id);
          CREATE INDEX idx_outcomes_success ON procedure_outcomes(success_status);
          CREATE INDEX idx_outcomes_readmission ON procedure_outcomes(readmission_30day);

          -- Create updated_at trigger function
          CREATE OR REPLACE FUNCTION update_updated_at_column()
          RETURNS TRIGGER AS $$
          BEGIN
              NEW.updated_at = CURRENT_TIMESTAMP;
              RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;

          -- Create triggers for updated_at columns
          CREATE TRIGGER update_robots_updated_at
              BEFORE UPDATE ON surgical_robots
              FOR EACH ROW
              EXECUTE FUNCTION update_updated_at_column();

          CREATE TRIGGER update_outcomes_updated_at
              BEFORE UPDATE ON procedure_outcomes
              FOR EACH ROW
              EXECUTE FUNCTION update_updated_at_column();

          -- Create views for common queries
          CREATE VIEW vw_robot_utilization AS
          SELECT
              r.robot_id,
              r.robot_serial_number,
              r.robot_model,
              r.facility_name,
              r.status,
              COUNT(p.procedure_id) as procedure_count,
              AVG(p.duration_minutes) as avg_procedure_duration,
              MAX(p.start_time) as last_procedure_date
          FROM surgical_robots r
          LEFT JOIN surgical_procedures p ON r.robot_id = p.robot_id
          GROUP BY r.robot_id, r.robot_serial_number, r.robot_model, r.facility_name, r.status;

          CREATE VIEW vw_procedure_outcomes_summary AS
          SELECT
              p.procedure_id,
              p.procedure_type,
              p.procedure_category,
              p.start_time,
              p.duration_minutes,
              p.complexity_score,
              r.robot_model,
              r.facility_name,
              o.success_status,
              o.blood_loss_ml,
              o.hospital_stay_days,
              o.patient_satisfaction_score
          FROM surgical_procedures p
          JOIN surgical_robots r ON p.robot_id = r.robot_id
          LEFT JOIN procedure_outcomes o ON p.procedure_id = o.procedure_id
          WHERE p.status = 'completed';

          CREATE VIEW vw_maintenance_costs AS
          SELECT
              r.robot_id,
              r.robot_serial_number,
              r.robot_model,
              r.facility_name,
              COUNT(m.maintenance_id) as maintenance_count,
              SUM(m.cost) as total_cost,
              AVG(m.cost) as avg_cost,
              SUM(m.downtime_hours) as total_downtime_hours
          FROM surgical_robots r
          LEFT JOIN robot_maintenance_logs m ON r.robot_id = m.robot_id
          GROUP BY r.robot_id, r.robot_serial_number, r.robot_model, r.facility_name;
          EOFSQL

          chown ec2-user:ec2-user /home/ec2-user/01-create-tables.sql

          # Create SQL data loading file 02-load-sample-data.sql
          cat > /home/ec2-user/02-load-sample-data.sql << 'EOFSQL'
          -- Medical Robotics Data Platform - Load Sample Data
          -- This script provides examples of loading data from CSV files

          -- Note: Adjust file paths to match your S3 bucket or local filesystem
          -- For S3, you'll need the aws_s3 extension and appropriate IAM permissions

          -- Example: Load data from local CSV files
          -- Replace '/path/to/' with actual paths from phase1-data-model/data_generators/sample_data/

          -- Load surgical_robots
          -- COPY surgical_robots(
          --     robot_id,
          --     robot_serial_number,
          --     robot_model,
          --     manufacturer,
          --     installation_date,
          --     facility_id,
          --     facility_name,
          --     status,
          --     last_maintenance_date,
          --     total_procedures,
          --     firmware_version,
          --     created_at,
          --     updated_at
          -- )
          -- FROM '/path/to/surgical_robots.csv'
          -- DELIMITER ','
          -- CSV HEADER;

          -- Load robot_maintenance_logs
          -- COPY robot_maintenance_logs(
          --     maintenance_id,
          --     robot_id,
          --     maintenance_date,
          --     maintenance_type,
          --     technician_id,
          --     technician_name,
          --     issues_found,
          --     actions_taken,
          --     parts_replaced,
          --     downtime_hours,
          --     next_maintenance_date,
          --     cost,
          --     created_at
          -- )
          -- FROM '/path/to/robot_maintenance_logs.csv'
          -- DELIMITER ','
          --CSV HEADER;

          -- Load surgical_procedures
          -- COPY surgical_procedures(
          --     procedure_id,
          --     robot_id,
          --     procedure_type,
          --     procedure_category,
          --     start_time,
          --     end_time,
          --     duration_minutes,
          --     surgeon_id,
          --     surgeon_name,
          --     patient_id,
          --     patient_age,
          --     patient_gender,
          --     complexity_score,
          --     status,
          --     created_at
          -- )
          -- FROM '/path/to/surgical_procedures.csv'
          -- DELIMITER ','
          -- CSV HEADER;

          -- Load procedure_outcomes
          -- COPY procedure_outcomes(
          --     outcome_id,
          --     procedure_id,
          --     success_status,
          --     blood_loss_ml,
          --     complications,
          --     hospital_stay_days,
          --     readmission_30day,
          --     patient_satisfaction_score,
          --     surgeon_notes,
          --     recovery_score,
          --     follow_up_required,
          --     created_at,
          --     updated_at
          -- )
          -- FROM '/path/to/procedure_outcomes.csv'
          -- DELIMITER ','
          -- CSV HEADER;

          -- Verify loaded data
          SELECT 'surgical_robots' as table_name, COUNT(*) as row_count FROM surgical_robots
          UNION ALL
          SELECT 'robot_maintenance_logs', COUNT(*) FROM robot_maintenance_logs
          UNION ALL
          SELECT 'surgical_procedures', COUNT(*) FROM surgical_procedures
          UNION ALL
          SELECT 'procedure_outcomes', COUNT(*) FROM procedure_outcomes;

          -- Sample queries to verify data integrity
          SELECT
              r.robot_model,
              COUNT(DISTINCT r.robot_id) as robot_count,
              COUNT(p.procedure_id) as total_procedures
          FROM surgical_robots r
          LEFT JOIN surgical_procedures p ON r.robot_id = p.robot_id
          GROUP BY r.robot_model
          ORDER BY total_procedures DESC;

          SELECT
              procedure_category,
              COUNT(*) as procedure_count,
              AVG(duration_minutes) as avg_duration,
              AVG(complexity_score) as avg_complexity
          FROM surgical_procedures
          WHERE status = 'completed'
          GROUP BY procedure_category
          ORDER BY procedure_count DESC;

          SELECT
              success_status,
              COUNT(*) as outcome_count,
              AVG(blood_loss_ml) as avg_blood_loss,
              AVG(hospital_stay_days) as avg_stay,
              AVG(patient_satisfaction_score) as avg_satisfaction
          FROM procedure_outcomes
          GROUP BY success_status
          ORDER BY outcome_count DESC;
          EOFSQL

          chown ec2-user:ec2-user /home/ec2-user/02-load-sample-data.sql

          # Create a README for the ec2-user
          cat > /home/ec2-user/README.txt << 'EOFREADME'
          Medical Robotics Data Platform - Bastion Host

          Available Scripts:
          -------------------
          1. ./connect-to-rds.sh
             - Connects to the RDS PostgreSQL database

          2. ./setup-schema.sh <sql-file>
             - Runs a SQL file against the RDS database
             - Example: ./setup-schema.sh 01-create-tables.sql

          Available SQL Files:
          --------------------
          1. 01-create-tables.sql
             - Creates the database schema (tables, indexes, views)
             - Run this first to set up the database structure

          2. 02-load-sample-data.sql
             - Sample data loading examples (mostly commented out)
             - Edit this file to load your CSV data

          Quick Start:
          ------------
          1. Create the database schema:
             ./setup-schema.sh 01-create-tables.sql

          2. (Optional) Connect to database interactively:
             ./connect-to-rds.sh

          3. Load your data by editing 02-load-sample-data.sql
             and running it with setup-schema.sh
          EOFREADME

          chown ec2-user:ec2-user /home/ec2-user/README.txt

          # Signal completion
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource BastionInstance --region ${AWS::Region}

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-bastion'
        - Key: Project
          Value: medical-robotics-data-platform
        - Key: Environment
          Value: !Ref EnvironmentName

  # Elastic IP (optional but recommended for consistent access)
  BastionEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref BastionInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-bastion-eip'
        - Key: Project
          Value: medical-robotics-data-platform

Outputs:
  BastionInstanceId:
    Description: Bastion Host Instance ID
    Value: !Ref BastionInstance
    Export:
      Name: !Sub '${EnvironmentName}-bastion-instance-id'

  BastionPublicIP:
    Description: Bastion Host Public IP Address
    Value: !GetAtt BastionInstance.PublicIp
    Export:
      Name: !Sub '${EnvironmentName}-bastion-public-ip'

  BastionElasticIP:
    Description: Bastion Host Elastic IP (persistent)
    Value: !Ref BastionEIP
    Export:
      Name: !Sub '${EnvironmentName}-bastion-eip'

  SSMConnectionCommand:
    Description: Command to connect via AWS Systems Manager Session Manager
    Value: !Sub 'aws ssm start-session --target ${BastionInstance} --region ${AWS::Region}'

  SSHConnectionCommand:
    Description: SSH connection command (if key pair is configured)
    Value: !If
      - HasKeyPair
      - !Sub 'ssh -i ~/.ssh/${KeyPairName}.pem ec2-user@${BastionEIP}'
      - 'Key pair not configured - use SSM Session Manager instead'

  DatabaseConnectionHelp:
    Description: How to connect to RDS from bastion
    Value: 'After connecting to bastion, run: cat README.txt for instructions'

  SetupInstructions:
    Description: Quick start guide
    Value: 'Connect to bastion, then run: ./setup-schema.sh 01-create-tables.sql'
