AWSTemplateFormatVersion: '2010-09-09'
Description: 'Medical Robotics Data Platform - Application Load Balancer'

Parameters:
  EnvironmentName:
    Description: Environment name prefix for resources
    Type: String
    Default: medrobotics
    AllowedPattern: '[a-z0-9-]+'

  ACMCertificateArn:
    Description: ARN of ACM certificate for HTTPS (leave empty for HTTP-only development)
    Type: String
    Default: ''

Resources:
  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - Fn::ImportValue: !Sub '${EnvironmentName}-public-subnet-1'
        - Fn::ImportValue: !Sub '${EnvironmentName}-public-subnet-2'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-alb-sg-id'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-alb'
        - Key: Project
          Value: medical-robotics-data-platform

  # Target Group for API Service
  APITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-api-tg'
      Port: 5000
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-vpc-id'
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-api-tg'
        - Key: Project
          Value: medical-robotics-data-platform

  # Target Group for Data Ingestion Service
  DataIngestionTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-ingestion-tg'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub '${EnvironmentName}-vpc-id'
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ingestion-tg'
        - Key: Project
          Value: medical-robotics-data-platform

  # HTTPS Listener (when certificate is provided)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref ACMCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref APITargetGroup

  # HTTP Listener (redirects to HTTPS when certificate exists, otherwise forwards)
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref APITargetGroup

  # Listener Rule for API Service (HTTPS when available)
  APIListenerRuleHTTPS:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref APITargetGroup

  # Listener Rule for API Service (HTTP fallback)
  APIListenerRuleHTTP:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: NoCertificate
    Properties:
      ListenerArn: !Ref HTTPListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref APITargetGroup

  # Listener Rule for Data Ingestion (HTTPS when available)
  DataIngestionListenerRuleHTTPS:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values:
            - /ingest/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref DataIngestionTargetGroup

  # Listener Rule for Data Ingestion (HTTP fallback)
  DataIngestionListenerRuleHTTP:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: NoCertificate
    Properties:
      ListenerArn: !Ref HTTPListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          Values:
            - /ingest/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref DataIngestionTargetGroup

Conditions:
  HasCertificate: !Not [!Equals [!Ref ACMCertificateArn, '']]
  NoCertificate: !Equals [!Ref ACMCertificateArn, '']

Outputs:
  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub '${EnvironmentName}-alb-arn'

  LoadBalancerDNS:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-alb-dns'

  LoadBalancerURL:
    Description: URL of the Application Load Balancer
    Value: !If
      - HasCertificate
      - !Sub 'https://${ApplicationLoadBalancer.DNSName}'
      - !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  HTTPListenerArn:
    Description: ARN of the HTTP Listener
    Value: !Ref HTTPListener
    Export:
      Name: !Sub '${EnvironmentName}-alb-http-listener-arn'

  HTTPSListenerArn:
    Description: ARN of the HTTPS Listener (when certificate is provided)
    Condition: HasCertificate
    Value: !Ref HTTPSListener
    Export:
      Name: !Sub '${EnvironmentName}-alb-https-listener-arn'

  PrimaryListenerArn:
    Description: ARN of the primary listener (HTTPS if certificate provided, HTTP otherwise)
    Value: !If
      - HasCertificate
      - !Ref HTTPSListener
      - !Ref HTTPListener
    Export:
      Name: !Sub '${EnvironmentName}-alb-listener-arn'

  APITargetGroupArn:
    Description: ARN of the API Target Group
    Value: !Ref APITargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-api-target-group-arn'

  DataIngestionTargetGroupArn:
    Description: ARN of the Data Ingestion Target Group
    Value: !Ref DataIngestionTargetGroup
    Export:
      Name: !Sub '${EnvironmentName}-ingestion-target-group-arn'
